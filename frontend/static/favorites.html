<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites — RSS Notify</title>
    <script>if (localStorage.getItem('rss-dark') === 'true') document.documentElement.classList.add('dark');</script>
    <script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['system-ui', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/theme.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen font-sans">

    <!-- Navigation bar -->
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="nav-bar" aria-label="Main navigation">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            <div class="nav-inner flex justify-between items-center">
                <div class="nav-brand-group flex items-center gap-6">
                    <div class="flex items-center gap-2.5">
                        <i class="fa-solid fa-rss brand-mark"></i>
                        <span class="text-lg font-semibold tracking-tight">RSS Notify</span>
                    </div>
                    <div class="flex gap-4 text-sm">
                        <a href="/" class="nav-link">Feed</a>
                        <a href="/favorites" class="nav-link active" aria-current="page">Favorites</a>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="darkModeBtn" class="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
                        <i class="fa-solid fa-sun dark-sun" style="width:1rem;height:1rem;"></i>
                        <i class="fa-solid fa-moon dark-moon" style="width:1rem;height:1rem;"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col gap-4">

        <header class="page-heading"><div class="eyebrow">CURATED BY YOU</div><h1>Keep your favorites close.</h1><p>Choose the companies you care about. Their stories will stand out in your feed.</p></header>

        <!-- Companies list -->
        <div id="companiesContainer">
            <div class="card">
                <p class="text-sm text-center py-6" style="color:var(--color-text-muted)">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading...
                </p>
            </div>
        </div>

    </main>

    <div id="appNotice" role="status" aria-live="polite" hidden></div>
    <script src="/static/ux.js"></script>
    <script src="/static/favorites.js"></script>
</body>
</html>
